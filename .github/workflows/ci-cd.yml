name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Run unit tests
      run: ./mvnw test
      
    - name: Run integration tests
      run: ./mvnw verify -DskipUnitTests
      
    - name: Generate test coverage report
      run: ./mvnw jacoco:report
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: target/surefire-reports/

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: ./mvnw clean package -DskipTests
      
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v3
      with:
        name: application-jar
        path: target/*.jar

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
          
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: tp2-blogging-app:latest
        load: true
        
    - name: Test Docker image
      run: |
        docker images
        echo "Docker image built successfully for local use"

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: tp2-blogging-app:latest
        format: 'table'
        output: 'trivy-results.txt'
        
    - name: Display scan results
      if: always()
      run: cat trivy-results.txt
        
    - name: Summary
      run: |
        echo "Pipeline completed successfully!"
        echo "Docker image built and scanned"
        echo "Git SHA: ${{ github.sha }}"
        echo ""
        echo "To run locally:"
        echo "git pull"
        echo "docker-compose -f docker-compose-observability.yml up -d --build"

