name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Run unit tests
      run: mvn test
      
    - name: Run integration tests
      run: mvn verify -DskipUnitTests
      
    - name: Generate test coverage report
      run: mvn jacoco:report
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean package -DskipTests
      
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: target/*.jar

  docker-build-and-scan:
    name: Build Docker Image and Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Check for Docker Hub secrets
      id: check_secrets
      run: |
        if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
          echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set"
          echo "secrets_available=true" >> $GITHUB_OUTPUT
        else
          echo "WARNING: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN not set. Skipping Docker Hub push."
          echo "secrets_available=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Login to DockerHub
      if: steps.check_secrets.outputs.secrets_available == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
          
    - name: Build and push Docker image
      id: build_push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ steps.check_secrets.outputs.secrets_available == 'true' }}
        tags: |
          ${{ steps.check_secrets.outputs.secrets_available == 'true' && format('{0}/tp2-blogging-app:latest', secrets.DOCKERHUB_USERNAME) || 'tp2-blogging-app:latest' }}
          ${{ steps.check_secrets.outputs.secrets_available == 'true' && format('{0}/tp2-blogging-app:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('tp2-blogging-app:{0}', github.sha) }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/tp2-blogging-app:latest
        cache-to: type=inline
        
    - name: Run Trivy vulnerability scanner on image
      if: steps.check_secrets.outputs.secrets_available == 'true'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/tp2-blogging-app:latest
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'
        
    - name: Run Trivy vulnerability scanner on filesystem
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'
        
    - name: Pipeline Summary
      run: |
        echo "Pipeline completed successfully!"
        if [ "${{ steps.check_secrets.outputs.secrets_available }}" == "true" ]; then
          echo "Docker image built and pushed to DockerHub"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/tp2-blogging-app:latest"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/tp2-blogging-app:${{ github.sha }}"
        else
          echo "Docker image built locally (Docker Hub secrets not configured)"
          echo "Image: tp2-blogging-app:latest"
          echo "To push to Docker Hub, add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets"
        fi
        echo "Git SHA: ${{ github.sha }}"

