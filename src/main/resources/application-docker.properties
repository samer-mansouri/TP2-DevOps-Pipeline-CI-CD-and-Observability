server.port=9090

# DB configuration - Docker MySQL container
# Use service name as hostname when Spring Boot runs in Docker container
spring.datasource.url=jdbc:mysql://tp2_devops_mysql:3306/blogging_app_apis
spring.datasource.username=root
spring.datasource.password=superadmin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# fileupload related configuration
spring.servlet.multipart.max-file-size = 10MB
spring.servlet.multipart.max-request-size = 10MB

project.image = images/

# Spring Security
logging.level.org.springframework.security=DEBUG

spring.devtools.restart.log-condition-evaluation-delta=false

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

