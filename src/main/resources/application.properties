server.port=9090

# DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/blogging_app_apis
spring.datasource.username=root
spring.datasource.password=superadmin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# fileupload related configuration
spring.servlet.multipart.max-file-size = 10MB
spring.servlet.multipart.max-request-size = 10MB

project.image = images/

# Spring Security
logging.level.org.springframework.security=DEBUG

# each restart a new password is generated to access the APIs so customize this setting
# == Moved to Database Basic Auth ==
# spring.security.user.name=lakshy
# spring.security.user.password=lakshy
# spring.security.user.roles=ADMIN

spring.devtools.restart.log-condition-evaluation-delta=false

# Actuator endpoints for Observability
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers,httptrace
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Tracing with Sleuth and Zipkin
spring.sleuth.sampler.probability=1.0
spring.zipkin.base-url=http://localhost:9411

# Application info
spring.application.name=blogging-app-apis
info.app.name=Blogging App APIs
info.app.description=Backend API for Blogging App
info.app.version=1.0.0