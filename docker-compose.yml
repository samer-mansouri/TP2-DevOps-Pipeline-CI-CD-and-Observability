version: '3.8'

services:
  # MySQL Database Service
  tp2_devops_mysql:
    image: mysql:8.0
    container_name: tp2_devops_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: superadmin123
      MYSQL_DATABASE: blogging_app_apis
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - tp2_devops_mysql_data:/var/lib/mysql
    networks:
      - tp2_devops_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psuperadmin123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Boot Application Service
  tp2_devops_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tp2_devops_blogging_app:latest
    container_name: tp2_devops_app
    restart: always
    ports:
      - "9090:9090"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: docker
      
      # Database configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://tp2_devops_mysql:3306/blogging_app_apis?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: superadmin123
      
      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      
      # File upload
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      PROJECT_IMAGE: /app/images/
      
      # Security logging
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
    volumes:
      - tp2_devops_app_images:/app/images
    networks:
      - tp2_devops_network
    depends_on:
      tp2_devops_mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  tp2_devops_mysql_data:
    name: tp2_devops_mysql_data
  tp2_devops_app_images:
    name: tp2_devops_app_images

networks:
  tp2_devops_network:
    name: tp2_devops_network
    driver: bridge

