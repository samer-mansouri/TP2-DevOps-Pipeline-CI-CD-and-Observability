global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { monitor: 'tp2-devops-monitor' }

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']         # was localhost

  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['tp2_devops_app:9090']     # was localhost
        labels:
          application: 'blogging-app-apis'
          environment: 'docker'
    scrape_interval: 10s
